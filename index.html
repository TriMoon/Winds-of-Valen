<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">

		<!-- Open Graph meta tags for social media sharing -->

				content="https://bioxyade-web.github.io/Winds-of-Valen/index.html">
		<meta	property="og:image"

				content="Winds of Valen Wiki | Gear Optimizer, Guides & AI Bot">

				content="https://bioxyade-web.github.io/Winds-of-Valen/og-image.jpg">

				content="summary_large_image">
		<meta	name="twitter:title"
				content="Winds of Valen Wiki | Gear Optimizer, Guides & AI Bot">

				content="The ultimate fan-made hub for Winds of Valen. Access the interactive gear optimizer and AI Wiki Bot.">

		<link rel="stylesheet" href="Styles.css">
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebSite",
			"name": "Winds of Valen Wiki",
			"url": "https://bioxyade-web.github.io/Winds-of-Valen/index.html",
			"potentialAction": {
				"@type": "SearchAction",
				"target": "https://bioxyade-web.github.io/Winds-of-Valen/index.html?q={search_term_string}",
				"query-input": "required name=search_term_string"
			}
		}
		</script>
		<script type="module" src="js/main.js"></script>
	</head>
	<body>
		<div class="header-section">
			<div class="lang-selector">
				<button class="lang-btn" data-lang="en">EN</button>
				<button class="lang-btn" data-lang="de">DE</button>
				<button class="lang-btn" data-lang="fr">FR</button>
			</div>
			<h1 class="title">Winds of Valen Wiki</h1>
			<div class="status-bar">
				<span>⚔️ <span data-key="srv-status"></span>: <span id="server-status" style="color: #4ade80;">Active</span></span>
				<span>👥 <span data-key="visitors"></span>: <span id="visit-count" style="color: #fbbf24;">...</span></span>
				<span>🕒 <span id="game-time">--:--</span></span>
			</div>
		</div>

		<div class="ticker-wrap">
			<div class="ticker-content" id="ticker-text"></div>
		</div>

		<div class="layout-grid">
			<div class="container">
				<h2 data-key="dashboard-title"></h2>
				<p data-key="dashboard-desc"></p>

				<div class="hero-stat-card">
					<span class="stat-label" data-key="hero-count-label"></span>
					<span class="stat-value" id="steam-count">...</span>
					<div class="stat-description" data-key="hero-count-desc"></div>
				</div>

				<div class="community-row">
					<a href="https://discord.com/invite/CKdTaXEJVm" target="_blank" class="community-card">
						<img src="https://cdn.simpleicons.org/discord/5865F2" alt="Discord Logo" class="community-icon">
						<div class="community-info">
							<h4 data-key="disc-title"></h4>
							<p data-key="disc-desc"></p>
							<span class="community-action" data-key="disc-act"></span>
						</div>
					</a>
					<a href="https://store.steampowered.com/app/4135880/Winds_of_Valen/" target="_blank" class="community-card">
						<img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam Logo" class="community-icon">
						<div class="community-info">
							<h4 data-key="steam-title"></h4>
							<p data-key="steam-desc"></p>
							<span class="community-action" data-key="steam-act"></span>
						</div>
					</a>
				</div>

				<div class="nav-grid">
					<a href="checklist.html" class="nav-card"
						><div>
							<h3 data-key="nav-chk-t"></h3>
							<p data-key="nav-chk-d"></p>
						</div>
						<div class="btn" data-key="nav-chk-b"></div
					></a>
					<a href="ai.html" class="nav-card"
						><div>
							<h3>
								🔮 <span id="Wiki-Bot" style="color: #23FA23;">Wiki Bot</span>
							</h3>
							<p data-key="nav-bot-d"></p>
						</div>
						<div class="btn" data-key="nav-bot-b"></div
					></a>
					<a href="equipper.html" class="nav-card"
						><div>
							<h3 data-key="nav-eq-t">⚔️ The Equipper</h3>
							<p data-key="nav-eq-d"></p>
						</div>
						<div class="btn" data-key="nav-eq-b"></div
					></a>
					<a href="Videos.html" class="nav-card"
						><div>
							<h3 data-key="nav-vid-t"></h3>
							<p data-key="nav-vid-d"></p>
						</div>
						<div class="btn" data-key="nav-vid-b"></div
					></a>
					<a href="combat-practice.html" class="nav-card"
						><div>
							<h3 data-key="nav-com-t"></h3>
							<p data-key="nav-com-d"></p>
						</div>
						<div class="btn" data-key="nav-com-b"></div
					></a>
				</div>
			</div>

			<div class="top-row">
				<div class="container">
					<h2 data-key="dyk-title"></h2>
					<p style="font-size: 12px; line-height: 1.5; margin: 0;" id="dyk-content"></p>
				</div>
				<div class="container">
					<h2 data-key="updates-title"></h2>
					<div class="update-table-container">
						<table>
							<thead>
								<tr>
									<th data-key="th-ver"></th>
									<th data-key="th-det"></th>
								</tr>
							</thead>
							<tbody id="updates-table-body"></tbody>
						</table>
					</div>
				</div>
			</div>

			<div class="container">
				<h2 data-key="gb-title"></h2>
				<div style="margin-bottom: 1lvh;">
					<div class="guestbook-list" id="guestbook-list">
						<div class="entry" data-key="gb-loading"></div>
					</div>
				</div>
				<input type="text" id="guest-name" class="guestbook-input" placeholder="Your Name...">
				<textarea id="guest-msg" class="guestbook-input" placeholder="Your Message..." rows="2"></textarea>
				<button id="submit-btn" class="btn" style="width: 100%;" data-key="gb-submit"></button>
			</div>
		</div>
	</body>
</html>
